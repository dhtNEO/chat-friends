name: chat-friends
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  security_opt: ["no-new-privileges:true"]
services:
  db:
    <<: *defaults
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friends}
      POSTGRES_DB: friends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?execute scripts/configure.sh}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d friends"]
      interval: 5s
      timeout: 3s
      retries: 15
    stop_grace_period: 45s
    mem_limit: 512m
  backend:
    <<: *defaults
    build: ../../backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friends}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:8080}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPACE_NAME: ${SPACE_NAME:-Entre amigos}
      SCREEN_BITRATE: ${SCREEN_BITRATE:-8000000}
      SCREEN_HEIGHT: ${SCREEN_HEIGHT:-1080}
      SCREEN_FPS: ${SCREEN_FPS:-60}
    depends_on:
      db: {condition: service_healthy}
      livekit: {condition: service_started}
    healthcheck:
      test: ["CMD", "bash", "/app/health.sh"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 1g
  livekit:
    <<: *defaults
    image: livekit/livekit-server:v1.9.12
    environment:
      NO_PROXY: localhost,127.0.0.1,backend,db,livekit,web
      no_proxy: localhost,127.0.0.1,backend,db,livekit,web
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./generated/livekit.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
    mem_limit: 768m
    stop_grace_period: 30s
  web:
    <<: *defaults
    build: ../../frontend
    environment:
      NO_PROXY: localhost,127.0.0.1,backend,db,livekit,web
      no_proxy: localhost,127.0.0.1,backend,db,livekit,web
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
volumes:
  database:
