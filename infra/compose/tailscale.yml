# Compose >=2.24.4. Nenhuma porta publicada no host.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      TS_USERSPACE: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: chat-amigos
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /etc/tailscale/serve.json
      TS_EXTRA_ARGS: --advertise-tags= --advertise-routes= --advertise-exit-node=false --accept-routes=false --ssh=false
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale-serve.json:/etc/tailscale/serve.json:ro
    networks:
      default:
        aliases: [livekit, web]
    healthcheck:
      test: [CMD-SHELL, "tailscale ip -4 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    mem_limit: 256m
  livekit:
    network_mode: service:tailscale
    ports: !override []
    depends_on:
      tailscale: {condition: service_healthy}
  web:
    network_mode: service:tailscale
    ports: !override []
    volumes:
      - ./Caddyfile.tailscale:/etc/caddy/Caddyfile:ro
    depends_on:
      tailscale: {condition: service_healthy}
volumes:
  tailscale_state:
