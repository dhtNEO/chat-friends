spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db:5432/friends}
    username: ${POSTGRES_USER:friends}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 8
  session:
    jdbc:
      initialize-schema: never
    timeout: 2h
  flyway:
    enabled: ${MIGRATIONS_ENABLED:true}
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
  tomcat:
    connection-timeout: 10s
    keep-alive-timeout: 20s
    max-connections: 200
    accept-count: 64
    threads:
      max: 40
      min-spare: 4
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
app:
  proxy-key: ${APP_PROXY_KEY:}
  mfa-key: ${MFA_ENCRYPTION_KEY:}
  admin-mfa-required: ${ADMIN_MFA_REQUIRED:false}
  session-absolute-seconds: 28800
  origin: ${APP_ORIGIN:http://localhost:8080}
  name: ${SPACE_NAME:Entre amigos}
  room: ${LIVEKIT_ROOM:amigos}
  livekit-url: ${LIVEKIT_INTERNAL_URL:http://livekit:7880}
  livekit-public-url: ${LIVEKIT_PUBLIC_URL:ws://localhost:8080}
  livekit-key: ${LIVEKIT_API_KEY}
  livekit-secret: ${LIVEKIT_API_SECRET}
  screen-bitrate: ${SCREEN_BITRATE:8000000}
  screen-height: ${SCREEN_HEIGHT:1080}
  screen-fps: ${SCREEN_FPS:30}
logging:
  level:
    root: WARN
    com.chatfriends: INFO
