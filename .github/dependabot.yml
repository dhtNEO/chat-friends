# Revisão mensal: todas as versões agrupadas por ecossistema, inclusive major.
# O limite abaixo vale por entrada e não limita PRs de segurança.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    groups:
      atualizacoes-de-versao:
        applies-to: version-updates
        patterns: ["*"]
      atualizacoes-de-seguranca:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    groups:
      atualizacoes-de-versao:
        applies-to: version-updates
        patterns: ["*"]
      atualizacoes-de-seguranca:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /infra/caddy
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    groups:
      atualizacoes-de-versao:
        applies-to: version-updates
        patterns: ["*"]
      atualizacoes-de-seguranca:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /infra/caddy]
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    groups:
      atualizacoes-de-versao:
        applies-to: version-updates
        patterns: ["*"]
      atualizacoes-de-seguranca:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    groups:
      atualizacoes-de-versao:
        applies-to: version-updates
        patterns: ["*"]
      atualizacoes-de-seguranca:
        applies-to: security-updates
        patterns: ["*"]
