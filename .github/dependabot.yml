version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
  - package-ecosystem: docker
    directories: [/, /infra/caddy]
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
